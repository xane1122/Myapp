<script>
const LOCAL_API_KEY='myassistant.openrouter_api_key', LOCAL_API_BASE_URL='myassistant.openrouter_base_url', LOCAL_MODEL='myassistant.main_model', LOCAL_CONVERSATION='myassistant.conversation_id', LOCAL_MARKDOWN_RENDER='myassistant.markdown_render', LOCAL_SHOW_THOUGHT='myassistant.show_role_thought', LOCAL_SHOW_ACTION='myassistant.show_role_action';
const LOCAL_ASSISTANT='myassistant.active_assistant', GROK_API_KEY='myassistant.grok_api_key', GROK_API_BASE_URL='myassistant.grok_api_base_url', GROK_MODEL='myassistant.grok_model';
const LOCAL_CONVERSATION_CACHE='myassistant.conversations_cache', LOCAL_HISTORY_PREFIX='myassistant.history.', LOCAL_HISTORY_FULL_PREFIX='myassistant.history_full.', HISTORY_LIMIT=500, HISTORY_INCREMENT_LIMIT=200;
const DEFAULT_MODEL='anthropic/claude-sonnet-4-6';
let activeAssistant=localStorage.getItem(LOCAL_ASSISTANT)==='grok'?'grok':'rhys',channelAssistantNames={rhys:'Rhys',grok:'Tail'};
let currentConversationID=Number(new URLSearchParams(location.search).get('conversation_id')||localStorage.getItem(activeAssistant==='grok'?LOCAL_CONVERSATION+'.grok':LOCAL_CONVERSATION)||0), conversationCache=[], isRenamingConversation=false, pendingAttachments=[], sendingAttachments=[], currentHistory=[];
let activeTypingCount=0,sendSequence=0;
const CHAT_BATCH_WINDOW_MS=0;
const ACCUMULATED_MESSAGES_KEY='myassistant.pending_accumulated_msgs',ACCUMULATED_MODE_KEY='myassistant.accumulated_mode';
const pendingChatBatches=new Map();
let accumulatedMessages=[];
let pasteImageSeq=0;
let historyRenderGeneration=0,historyRenderStart=0,messageInsertBefore=null,suppressMessageScroll=false,searchJumpLock=null,messageSearchQuery='',messageSearchNextOffset=0,messageSearchController=null,userReviewingHistory=false;
let chatEntryGeneration=0,chatEntryPending=false,chatEntryTimer=0,lastRenderedHistoryKey='',scrollBottomFrame=0,scrollBottomForce=false;
const MAX_RENDERED_HISTORY=160,HISTORY_CACHE_LIMIT=160;
const MAX_IMAGES=9,MAX_IMAGE_BYTES=12*1024*1024,MAX_BATCH_BYTES=36*1024*1024,MAX_IMAGE_EDGE=2048,IMAGE_QUALITY=.82;
const msgContainer=document.getElementById('messages'), welcome=document.getElementById('welcome'), messagesTopActions=document.querySelector('.messages-top-actions'),latestMessageButton=document.getElementById('latestMessageButton');
function distanceFromMessageBottom(){return Math.max(0,msgContainer.scrollHeight-msgContainer.clientHeight-msgContainer.scrollTop)}
function setReviewingHistory(reviewing){userReviewingHistory=Boolean(reviewing);msgContainer.dataset.reviewingHistory=userReviewingHistory?'true':'false';latestMessageButton.hidden=!userReviewingHistory}
function updateHistoryScrollState(){setReviewingHistory(distanceFromMessageBottom()>32)}
function scrollToLatestMessage(){setReviewingHistory(false);msgContainer.scrollTo({top:msgContainer.scrollHeight,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function captureHistoryViewport(){if(!userReviewingHistory)return null;const containerTop=msgContainer.getBoundingClientRect().top,anchor=[...msgContainer.querySelectorAll('.msg')].find(el=>el.getBoundingClientRect().bottom>containerTop);return anchor?{id:anchor.dataset.messageId,index:anchor.dataset.bubbleIndex||'',offset:anchor.getBoundingClientRect().top-containerTop,scrollTop:msgContainer.scrollTop}:null}
function restoreHistoryViewport(viewport){if(!viewport)return;const candidates=[...msgContainer.querySelectorAll('.msg')],anchor=candidates.find(el=>el.dataset.messageId===viewport.id&&(el.dataset.bubbleIndex||'')===viewport.index);msgContainer.scrollTop=anchor?msgContainer.scrollTop+anchor.getBoundingClientRect().top-msgContainer.getBoundingClientRect().top-viewport.offset:viewport.scrollTop;setReviewingHistory(true)}
msgContainer.addEventListener('scroll',updateHistoryScrollState,{passive:true});
msgContainer.addEventListener('touchmove',()=>requestAnimationFrame(updateHistoryScrollState),{passive:true});

function clientLog(event,details={}){
  const line={event,conversation_id:currentConversationID,details};
  try{console.info('[myapp]',line)}catch{}
  const payload=JSON.stringify({event,conversation_id:currentConversationID,details});
  try{fetch('/api/client-events',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{})}catch{}
}
window.addEventListener('error',e=>clientLog('window_error',{message:e.message,source:e.filename,line:e.lineno,column:e.colno}));
window.addEventListener('unhandledrejection',e=>clientLog('unhandled_rejection',{reason:String(e.reason&&e.reason.message||e.reason||'unknown')}));
async function init(){clientLog('app_init',{href:location.href,user_agent:navigator.userAgent});restoreAccumulatedMessages();renderAppRoute();updateMarkdownToggle();updateAccumulatedModeButton();const channelNamesPromise=loadChannelAssistantNames();await loadConversations();if(currentConversationID>0)await loadHistory();await focusNotificationMessage();renderAccumulatedMessagesForConversation();refreshUsage();Promise.allSettled([channelNamesPromise]);setInterval(()=>{if(!document.hidden)syncAutonomousMessages()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAutonomousMessages()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js?v=969',{updateViaCache:'none'}).then(reg=>reg.update()).then(()=>clientLog('service_worker_registered',{})).catch(err=>clientLog('service_worker_register_failed',{error:String(err)}));}
async function focusNotificationMessage(){const params=new URLSearchParams(location.search),messageID=Number(params.get('message_id')||0);if(!messageID)return;await jumpSearchResult(currentConversationID,messageID);params.delete('message_id');params.delete('notification_source');history.replaceState(history.state,'',location.pathname+(params.size?'?'+params.toString():''))}
async function syncAutonomousMessages(){if(activeTypingCount>0||!currentConversationID)return;try{const remote=maxMessageID(await loadHistoryProbe(currentConversationID)),local=maxMessageID(currentHistory);if(remote>local)await loadHistory()}catch(e){clientLog('wake_sync_failed',{error:String(e&&e.message||e)})}}
async function loadChannelAssistantNames(){try{const d=await fetch('/api/model-channels',{cache:'no-store'}).then(r=>r.json()),c=d.channels||{};channelAssistantNames={rhys:c.reply?.assistant_name||'Rhys',grok:c.grok?.assistant_name||'Tail'};document.querySelectorAll('.home-feature[data-id="rhys"],.home-feature[data-id="grok"]').forEach(item=>{const name=channelAssistantNames[item.dataset.id]||(item.dataset.id==='grok'?'Tail':'Rhys');item.setAttribute('aria-label',name);const label=item.querySelector('.home-feature-name');if(label)label.textContent=name})}catch{}}
function aiName(){return channelAssistantNames[activeAssistant]||(activeAssistant==='grok'?'Tail':'Rhys')} function apiKey(){return''} function apiBaseURL(){return localStorage.getItem(activeAssistant==='grok'?GROK_API_BASE_URL:LOCAL_API_BASE_URL)||''} function model(){return localStorage.getItem(activeAssistant==='grok'?GROK_MODEL:LOCAL_MODEL)||DEFAULT_MODEL}
async function syncModelChannel(channel=activeAssistant==='grok'?'grok':'reply'){try{const d=await fetch('/api/model-channels',{cache:'no-store'}).then(r=>r.json()),cfg=(d.channels||{})[channel]||{};localStorage.setItem(channel==='grok'?GROK_API_BASE_URL:LOCAL_API_BASE_URL,cfg.base_url||'');localStorage.setItem(channel==='grok'?GROK_MODEL:LOCAL_MODEL,cfg.model||DEFAULT_MODEL)}catch{}}
function waitForBubbleSkins(){const ready=window.MyAppBubbleSkins?.ready;return ready&&typeof ready.then==='function'?Promise.race([ready,new Promise(resolve=>setTimeout(resolve,400))]):Promise.resolve()}
function beginChatEntry(){const token=++chatEntryGeneration;chatEntryPending=true;clearTimeout(chatEntryTimer);document.getElementById('app').classList.add('chat-preparing');chatEntryTimer=setTimeout(()=>finishChatEntry(token),1500);return token}
async function finishChatEntry(token){if(token!==chatEntryGeneration||!chatEntryPending)return;await waitForBubbleSkins();if(token!==chatEntryGeneration||!chatEntryPending)return;chatEntryPending=false;clearTimeout(chatEntryTimer);requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token!==chatEntryGeneration)return;scrollBottom(true);document.getElementById('app').classList.remove('chat-preparing')}))}
async function openAssistant(assistant){const entryToken=beginChatEntry();activeAssistant=assistant==='grok'?'grok':'rhys';const assistantAtOpen=activeAssistant;localStorage.setItem(LOCAL_ASSISTANT,activeAssistant);currentConversationID=Number(localStorage.getItem(activeAssistant==='grok'?LOCAL_CONVERSATION+'.grok':LOCAL_CONVERSATION)||0);conversationCache=[];currentHistory=[];resetMessages();switchTab('chat',null,{deferScroll:true});document.getElementById('inp').placeholder=activeAssistant==='grok'?'Tail，想聊什么？':'小猫要说什么';let id=currentConversationID;const conversationsPromise=loadConversations(id);const cached=readConversationHistory(id);if(cached.length)renderHistory(cached,'assistant_cache',id);try{await conversationsPromise;if(activeAssistant!==assistantAtOpen||entryToken!==chatEntryGeneration)return;id=currentConversationID;if(!(id>0))throw new Error('没有可加载的会话');const recent=await loadRecentHistory(id);if(activeAssistant!==assistantAtOpen||currentConversationID!==id)return;writeConversationHistory(id,recent);renderHistory(recent,'assistant_recent',id);clientLog('assistant_recent_ready',{assistant:assistantAtOpen,conversation_id:id,messages:recent.length});setTimeout(async()=>{if(activeAssistant!==assistantAtOpen||currentConversationID!==id)return;try{await loadFullHistory(id,recent);clientLog('assistant_full_history_ready',{assistant:assistantAtOpen,conversation_id:id})}catch(e){clientLog('assistant_full_history_failed',{assistant:assistantAtOpen,conversation_id:id,error:String(e&&e.message||e)})}},0)}catch(e){clientLog('assistant_recent_failed',{assistant:assistantAtOpen,conversation_id:id,error:String(e&&e.message||e)});if(!cached.length)toast('最近消息加载失败')}finally{finishChatEntry(entryToken);Promise.resolve(conversationsPromise).catch(()=>{})}}
function markdownRender(){return localStorage.getItem(LOCAL_MARKDOWN_RENDER)==='true'}
function showRoleThought(){return localStorage.getItem(LOCAL_SHOW_THOUGHT)!=='false'}
function showRoleAction(){return localStorage.getItem(LOCAL_SHOW_ACTION)!=='false'}
function toggleMorePanel(force){const p=document.getElementById('morePanel'),btn=document.getElementById('moreBtn');p.classList.toggle('open',force===undefined?!p.classList.contains('open'):force);const open=p.classList.contains('open');btn.classList.toggle('active',open);btn.setAttribute('aria-expanded',String(open));btn.setAttribute('aria-label',open?'关闭更多功能':'展开更多功能')}
function pickImage(){toggleMorePanel(false);document.getElementById('imageInput').click()}
function openFeature(title,html){toggleMorePanel(false);document.getElementById('featureTitle').textContent=title;document.getElementById('featureBody').innerHTML=html;document.getElementById('featureModal').classList.add('open')}
function closeFeatureModal(e){const modal=document.getElementById('featureModal');if(e&&e.target!==modal)return;NativeFeel.closeSurface(modal)}
function openTransferPanel(){openFeature('转账',`<form class="transfer-form" onsubmit="submitVirtualTransfer(event)"><label>金额<div class="transfer-amount-input"><span>¥</span><input id="transferAmount" type="number" inputmode="decimal" min="0.01" max="1000000" step="0.01" placeholder="0.00" required></div></label><label>备注<input id="transferNote" maxlength="60" placeholder="转账备注（选填）"></label><button type="submit">转账给 ${escapeHtml(aiName())}</button></form>`);setTimeout(()=>document.getElementById('transferAmount')?.focus(),60)}
async function submitVirtualTransfer(e){e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type="submit"]'),amount=Number(document.getElementById('transferAmount').value),note=document.getElementById('transferNote').value.trim(),requestKey=form.dataset.requestKey||(form.dataset.requestKey=crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`);button.disabled=true;try{const r=await fetch('/api/virtual-transfers',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':requestKey},body:JSON.stringify({conversation_id:currentConversationID,amount,note})}),d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||`转账失败（${r.status}）`);NativeFeel.closeSurface(document.getElementById('featureModal'));const message=normalizeRoleMessage(d.message);if(!currentHistory.some(item=>Number(item.id)===Number(message.id))){currentHistory.push(message);writeConversationHistory(currentConversationID,currentHistory);addMsg(message.role,message.content,[],false,null,message)}toast('转账已发送');await loadConversations(currentConversationID)}catch(err){toast(err.message)}finally{button.disabled=false}}
async function openSavedPanel(){openFeature('我的收藏','<div class="feature-loading">加载中…</div>');try{const d=await fetch('/api/saved-messages').then(r=>r.json());const body=document.getElementById('featureBody');body.innerHTML=(d.items||[]).length?(d.items||[]).map(x=>`<article class="saved-card"><small>${escapeHtml(x.conversation_title||'新对话')} · ${escapeHtml(formatBeijingDateTime(x.created_at))}</small><p>${escapeHtml(x.content)}</p><div><button onclick="jumpSaved(${x.conversation_id},${x.message_id})">回到消息</button><button onclick="navigator.clipboard.writeText(${JSON.stringify(x.content).replace(/</g,'\\u003c')});toast('已复制')">复制</button><button onclick="removeSaved(${x.message_id},this)">取消收藏</button></div></article>`).join(''):'<div class="feature-empty">还没有收藏消息</div>'}catch(e){toast('收藏加载失败')}}

async function jumpSearchResult(conversationID,messageID,bubbleIndex=-1){
  const modal=document.getElementById('featureModal');
  if(modal?.classList.contains('open')&&!modal.classList.contains('closing')){
    await new Promise(resolve=>NativeFeel.closeSurface(modal,resolve));
  }

    if(searchJumpLock!==lock)return;
    renderHistory(history,'search_jump',currentConversationID);
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
      try{
        if(searchJumpLock!==lock)return;
        const el=revealHistoryMessage(messageID,bubbleIndex);
        clientLog('search_jump_located',{conversation_id:Number(conversationID),message_id:Number(messageID),bubble_index:Number(bubbleIndex),found:Boolean(el),history_messages:history.length});
        if(!el){searchJumpLock=null;return toast('无法定位这条聊天记录')}
        el.classList.add('message-focus');stabilizeSearchMessage(lock,el);
        setTimeout(()=>{el.classList.remove('message-focus');if(searchJumpLock===lock)searchJumpLock=null},3000);
      }finally{resolve()}
    })));
    refreshUsage();
  }catch(e){if(searchJumpLock===lock)searchJumpLock=null;toast('打开聊天记录失败：'+e.message)}
  finally{
    // Consume this navigation attempt even when a deleted message or network error
    // prevents focus; an old notification must not redirect the next ordinary launch.
    if(window.MyAppNative?.request){
      window.MyAppNative.request('route.handled',{conversation_id:String(conversationID),message_id:String(messageID)})
        .catch(()=>clientLog('notification_route_ack_failed',{}));
    }
  }
}

async function refreshChatFailureNotices(conversationID=currentConversationID){

    const response=await fetch('/api/chat-failures?conversation_id='+encodeURIComponent(conversationID),{cache:'no-store'}),data=await response.json();
    if(!response.ok||data.error)throw new Error(data.error||`失败记录请求失败（${response.status}）`);

    msgContainer.querySelectorAll('.reply-failure-notice').forEach(node=>node.remove());
    const renderedUserIDs=new Set();for(const failure of (data.failures||[])){if(renderChatFailureNotice(failure)){renderedUserIDs.add(Number(failure.user_message_id))}}
    if(renderedUserIDs.size&&!userReviewingHistory)scheduleScrollBottom();return renderedUserIDs;
  }catch(error){clientLog('chat_failure_history_failed',{conversation_id:Number(conversationID),error:String(error&&error.message||error)});return null}

function decodeJSONTextFragment(value){

  for(let i=0;i<value.length;i++){
    const ch=value[i];if(ch!=='\\'){out+=ch;continue}
    if(i+1>=value.length)break;
    const esc=value[++i],simple={'"':'"','\\':'\\','/':'/','b':'\b','f':'\f','n':'\n','r':'\r','t':'\t'};
    if(Object.prototype.hasOwnProperty.call(simple,esc)){out+=simple[esc];continue}

      const hex=value.slice(i+1,i+5);if(hex.length<4||!/^[0-9a-f]{4}$/i.test(hex))break;
      out+=String.fromCharCode(parseInt(hex,16));i+=4;
    }
  }

const CODEX_STATUS_NAMES={queued:'排队中',running:'执行中',succeeded:'已完成',failed:'失败'};
function cleanCodexMessage(text){return String(text||'').replace(/```[\s\S]*?```/g,'').split('\n').filter(line=>{const value=line.trim();return value&&!/^(?:\$\s+|>\s+)?(?:cd\s+|git\s+|rg\s+|find\s+|sed\s+|cat\s+|ls(?:\s|$)|npm\s+|pnpm\s+|yarn\s+|go\s+|pytest\s+|curl\s+|sqlite3\s+)/i.test(value)&&!/^\s*(?:command|exit code|stdout|stderr):/i.test(value)}).join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function visibleCodexOutput(raw,status){
  const text=String(raw||'').replace(/\r/g,''),messageMarker=/^(codex|assistant)$/i,hiddenMarker=/^(user|analysis|exec|tool|function|tokens used|thinking|command|stdout|stderr)$/i,lines=text.split('\n'),messages=[];
  for(let i=0;i<lines.length;i++)if(messageMarker.test(lines[i].trim())){const part=[];for(i++;i<lines.length&&!hiddenMarker.test(lines[i].trim())&&!messageMarker.test(lines[i].trim());i++)part.push(lines[i]);i--;const message=cleanCodexMessage(part.join('\n'));if(message)messages.push(message)}
  if(!messages.length){const fallback=cleanCodexMessage(text.replace(/^OpenAI Codex[\s\S]*?^-{4,}\s*$/m,'').replace(/^\[codex-bridge\].*$/gm,'').replace(/^\s*(?:Explored|Ran|Worked|Investigated)\b[\s\S]*$/gmi,''));return {nodes:[],result:fallback||(status==='running'||status==='queued'?'等待 Codex 返回结果':'暂无可显示结果')}}
  return {nodes:messages.slice(0,-1),result:messages[messages.length-1]}
}

async function loadCodexTasks(){const list=document.getElementById('codexTaskList'),state=document.getElementById('codexState');if(!list||codexRefreshInFlight)return;codexRefreshInFlight=true;let nextDelay=30000;try{const response=await fetch('/api/codex-tasks?limit=30',{cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`加载失败（${response.status}）`);const tasks=data.tasks||[],open=new Set([...list.querySelectorAll('details[open]')].map(item=>item.dataset.taskId));list.innerHTML=tasks.length?tasks.map((task,index)=>codexTaskHTML(task).replace(' open>',open.has(String(task.id))||(!open.size&&index===0)?' open>':'>')).join(''):'<p class="codex-empty">还没有 Codex 任务</p>';const active=tasks.some(task=>task.status==='queued'||task.status==='running');if(state)state.textContent=active?'任务处理中':'已连接';codexRefreshFailures=0;nextDelay=active?3000:30000}catch(error){codexRefreshFailures++;nextDelay=Math.min(60000,3000*Math.pow(2,Math.min(codexRefreshFailures,4)));if(state)state.textContent=`重连中 · ${Math.round(nextDelay/1000)}秒`;if(!list.querySelector('.codex-task'))list.innerHTML=`<p class="codex-empty">${escapeHtml(error.message)}</p>`}finally{codexRefreshInFlight=false;scheduleCodexRefresh(nextDelay)}}

function daysMatterDiff(from,to){const a=from.split('-').map(Number),b=to.split('-').map(Number);return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/86400000)}

const beijingToday=beijingDateParts();let mailboxDatesCache={},mailboxCalendarMonth=new Date(Date.UTC(beijingToday.year,beijingToday.month-1,1));

function setMailboxUser(){renderMailboxPage()}
async function renderMailboxPage(){document.documentElement.classList.remove('home-bg','chat-bg');document.body.classList.remove('home-bg','chat-bg');document.getElementById('messages').style.display='none';document.getElementById('inputArea').style.display='none';document.getElementById('tabBar').style.display='none';const panel=document.getElementById('homePanel');panel.style.display='block';panel.className='pane mailbox-page';const idParam=new URLSearchParams(location.search).get('id');if(idParam!==null){const id=Number(idParam);if(Number.isInteger(id)&&id>0)return renderMailboxDetail(panel,id);history.replaceState({view:'feature'},'','/mailbox')}const params=new URLSearchParams(location.search),q=params.get('q')||'',date=params.get('date')||'',user=mailboxUser();panel.innerHTML=`<header class="mailbox-head"><button class="feature-back" type="button" onclick="appNavigate('/home')" aria-label="返回主页">‹</button><h1>留言箱</h1></header><main class="mailbox-main"><form class="mailbox-search" onsubmit="searchMailbox(event)"><button type="button" onclick="toggleMailboxCalendar()" aria-label="按日期筛选">▣</button><input name="q" value="${escapeHtml(q)}" placeholder="搜索留言" maxlength="80"><button type="submit" aria-label="搜索">⌕</button></form><section id="mailboxCalendar" class="mailbox-calendar" hidden></section>${date?`<button class="mailbox-date-filter" onclick="clearMailboxDate()">${escapeHtml(date)} ×</button>`:''}<form class="mailbox-compose" onsubmit="postMailbox(event)"><div class="mailbox-user-switch"><label><input type="radio" name="sender" value="Xane" ${user==='Xane'?'checked':''} onchange="setMailboxUser(this.value)"><span>Xane</span></label><label><input type="radio" name="sender" value="Rhys" ${user==='Rhys'?'checked':''} onchange="setMailboxUser(this.value)"><span>Rhys</span></label></div><textarea name="content" maxlength="200" placeholder="写一条留言…" oninput="this.nextElementSibling.querySelector('span').textContent=this.value.length"></textarea><footer><small><span>0</span>/200</small><button type="submit">发布</button></footer></form><section id="mailboxList" class="mailbox-list"><p class="mailbox-empty">加载中…</p></section></main>`;try{const [list,dates]=await Promise.all([fetch('/api/mailbox?'+new URLSearchParams({q,date})).then(readBellJSON),fetch('/api/mailbox/dates').then(readBellJSON)]);mailboxDatesCache=dates.dates||{};renderMailboxMessages(list.messages||[])}catch(e){document.getElementById('mailboxList').innerHTML=`<p class="mailbox-empty">${escapeHtml(e.message)}</p>`}}
function renderMailboxMessages(items){const box=document.getElementById('mailboxList'),user=mailboxUser();if(!items.length){box.innerHTML='<p class="mailbox-empty">还没有留言</p>';return}box.innerHTML=items.map(m=>`<article class="mailbox-card ${m.sender==='Xane'?'from-xane':'from-assistant'}" role="link" tabindex="0" onclick="openMailboxMessage(${m.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMailboxMessage(${m.id})}"><header><strong>From ${escapeHtml(m.sender)}</strong><time>${formatMailboxTime(m.created_at)}</time></header><p>${escapeHtml(m.content)}</p>${m.sender===user?`<button type="button" onclick="deleteMailbox(${m.id},event)" aria-label="删除留言">×</button>`:''}</article>`).join('')}
function openMailboxMessage(id){history.pushState({view:'feature'},'',`/mailbox?id=${id}`);renderAppRoute()}
async function renderMailboxDetail(panel,id){document.documentElement.classList.remove('home-bg','chat-bg');document.body.classList.remove('home-bg','chat-bg');document.getElementById('messages').style.display='none';document.getElementById('inputArea').style.display='none';document.getElementById('tabBar').style.display='none';panel.style.display='block';panel.className='pane mailbox-page mailbox-detail-page';panel.innerHTML=`<header class="mailbox-head"><button class="feature-back" type="button" onclick="history.back()" aria-label="返回留言列表">‹</button><h1>留言详情</h1></header><main class="mailbox-detail"><p class="mailbox-empty">加载中…</p></main>`;try{const d=await fetch(`/api/mailbox/${id}`).then(readBellJSON),m=d.message,user=mailboxUser();panel.querySelector('.mailbox-detail').innerHTML=`<article class="mailbox-detail-card from-${m.sender.toLowerCase()}"><header><strong>From ${escapeHtml(m.sender)}</strong><time>${formatMailboxTime(m.created_at)}</time></header><p>${escapeHtml(m.content)}</p>${m.sender===user?`<button class="mailbox-detail-delete" type="button" onclick="deleteMailbox(${m.id},event,true)">删除留言</button>`:''}</article>`}catch(e){panel.querySelector('.mailbox-detail').innerHTML=`<p class="mailbox-empty">${escapeHtml(e.message)}</p>`}}
function formatMailboxTime(v){const d=parseStoredTime(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('zh-CN',{timeZone:BEIJING_TIME_ZONE,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function searchMailbox(e){e.preventDefault();const p=new URLSearchParams(location.search),q=e.target.elements.q.value.trim();q?p.set('q',q):p.delete('q');history.replaceState({view:'feature'},'','/mailbox'+(p.size?'?'+p:''));renderMailboxPage()}
async function postMailbox(e){e.preventDefault();const f=e.target.elements,content=f.content.value.trim();if(!content)return toast('请输入留言');try{await fetch('/api/mailbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})}).then(readBellJSON);renderMailboxPage();toast('留言已发布')}catch(err){toast(err.message)}}
async function deleteMailbox(id,event,fromDetail=false){event?.preventDefault();event?.stopPropagation();const button=event?.currentTarget;if(button?.disabled)return;const confirmed=await NativeFeel.confirm('删除后将无法恢复。',{title:'删除留言',confirmText:'删除'});if(!confirmed)return;if(button)button.disabled=true;try{await fetch(`/api/mailbox/${id}`,{method:'DELETE'}).then(readBellJSON);if(fromDetail)history.replaceState({view:'feature'},'','/mailbox');renderMailboxPage();toast('留言已删除')}catch(err){if(button)button.disabled=false;toast(err.message)}}
function toggleMailboxCalendar(){const box=document.getElementById('mailboxCalendar');box.hidden=!box.hidden;if(!box.hidden)renderMailboxCalendar()}
function renderMailboxCalendar(){const box=document.getElementById('mailboxCalendar'),y=mailboxCalendarMonth.getUTCFullYear(),m=mailboxCalendarMonth.getUTCMonth(),first=new Date(Date.UTC(y,m,1)),days=new Date(Date.UTC(y,m+1,0)).getUTCDate(),offset=(first.getUTCDay()+6)%7;let cells='<span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>';for(let i=0;i<offset;i++)cells+='<i></i>';for(let d=1;d<=days;d++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,on=mailboxDatesCache[key];cells+=`<button ${on?'':'disabled'} onclick="selectMailboxDate('${key}')">${d}</button>`}box.innerHTML=`<header><button onclick="moveMailboxMonth(-1)">‹</button><strong>${y}年${m+1}月</strong><button onclick="moveMailboxMonth(1)">›</button></header><div>${cells}</div>`}
function moveMailboxMonth(delta){mailboxCalendarMonth=new Date(Date.UTC(mailboxCalendarMonth.getUTCFullYear(),mailboxCalendarMonth.getUTCMonth()+delta,1));renderMailboxCalendar()}
function selectMailboxDate(date){const p=new URLSearchParams(location.search);p.set('date',date);history.replaceState({view:'feature'},'','/mailbox?'+p);renderMailboxPage()}
function clearMailboxDate(){const p=new URLSearchParams(location.search);p.delete('date');history.replaceState({view:'feature'},'','/mailbox'+(p.size?'?'+p:''));renderMailboxPage()}
function persistFeatureOrder(root){localStorage.setItem(HOME_ORDER_KEY,JSON.stringify([...root.querySelectorAll('.home-feature')].map(x=>x.dataset.id)))}
function rebalanceFeaturePages(root){const items=[...root.querySelectorAll('.home-feature')],grids=[...root.querySelectorAll('.home-feature-grid')];items.forEach((item,index)=>grids[Math.min(grids.length-1,Math.floor(index/8))].append(item))}
function bindFeatureDrag(root){let dragged=null,ghost=null,longPress=0,edgeTimer=0,edgePage=-1,startX=0,startY=0,pointerDragging=false,suppressClick=false,lastTarget=null,lastAfter=false,grabX=0,grabY=0;const currentPage=()=>Math.max(0,Math.min(root.children.length-1,Math.round(root.scrollLeft/root.clientWidth))),positions=()=>new Map([...root.querySelectorAll('.home-feature:not(.dragging)')].map(item=>[item,item.getBoundingClientRect()])),animateFrom=before=>requestAnimationFrame(()=>before.forEach((box,item)=>{if(!item.isConnected)return;const next=item.getBoundingClientRect(),dx=box.left-next.left,dy=box.top-next.top;if(!dx&&!dy)return;item.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:220,easing:'cubic-bezier(.22,.61,.36,1)'})})),moveGhost=(x,y)=>{if(ghost)ghost.style.transform=`translate3d(${x-grabX}px,${y-grabY}px,0) scale(1.08)`},moveBefore=(target,after=false)=>{if(!dragged?.isConnected||!target?.isConnected||target===dragged||!target.parentElement)return;if(target===lastTarget&&after===lastAfter)return;lastTarget=target;lastAfter=after;const before=positions(),reference=after?target.nextElementSibling:target;target.parentElement.insertBefore(dragged,reference);animateFrom(before)},moveToPage=(page,x)=>{const grid=root.querySelector(`.home-page[data-page="${page}"] .home-feature-grid`);if(!grid||!dragged)return;const targets=[...grid.querySelectorAll('.home-feature:not(.dragging)')];if(targets.length){const target=x<root.clientWidth/2?targets[0]:targets.at(-1);moveBefore(target,x>=root.clientWidth/2)}else grid.append(dragged)},queueEdgePage=x=>{const margin=Math.min(72,root.clientWidth*.2),page=currentPage(),next=x<=margin?page-1:x>=root.clientWidth-margin?page+1:-1;if(next<0||next>=root.children.length||next===page){clearTimeout(edgeTimer);edgeTimer=0;edgePage=-1;return}if(edgeTimer&&edgePage===next)return;clearTimeout(edgeTimer);edgePage=next;edgeTimer=setTimeout(()=>{edgeTimer=0;root.scrollTo({left:next*root.clientWidth,behavior:'smooth'});moveToPage(next,x)},280)},placeAtPoint=(x,y)=>{moveGhost(x,y);queueEdgePage(x);const target=document.elementFromPoint(x,y)?.closest('.home-feature');if(target&&target!==dragged){const box=target.getBoundingClientRect();moveBefore(target,x>box.left+box.width/2)}};root.addEventListener('pointerdown',e=>{const item=e.target.closest('.home-feature');if(!item||e.button>0)return;startX=e.clientX;startY=e.clientY;lastTarget=null;longPress=setTimeout(()=>{const box=item.getBoundingClientRect();dragged=item;pointerDragging=true;suppressClick=true;grabX=e.clientX-box.left;grabY=e.clientY-box.top;ghost=item.cloneNode(true);ghost.classList.add('home-feature-drag-ghost');ghost.style.width=box.width+'px';ghost.style.height=box.height+'px';document.body.append(ghost);moveGhost(e.clientX,e.clientY);item.setPointerCapture(e.pointerId);root.classList.add('sorting');item.classList.add('dragging')},300)});root.addEventListener('pointermove',e=>{if(!pointerDragging){if(Math.hypot(e.clientX-startX,e.clientY-startY)>8)clearTimeout(longPress);return}e.preventDefault();placeAtPoint(e.clientX,e.clientY)});const finish=e=>{clearTimeout(longPress);clearTimeout(edgeTimer);if(pointerDragging){e.preventDefault();const box=dragged?.getBoundingClientRect();if(ghost&&box){ghost.style.transition='transform .18s cubic-bezier(.22,.61,.36,1),opacity .18s';ghost.style.transform=`translate3d(${box.left}px,${box.top}px,0) scale(1)`;ghost.style.opacity='0';setTimeout(()=>ghost?.remove(),190)}else ghost?.remove();dragged?.classList.remove('dragging');rebalanceFeaturePages(root);persistFeatureOrder(root);setTimeout(()=>suppressClick=false,100)}root.classList.remove('sorting');pointerDragging=false;dragged=null;ghost=null;lastTarget=null;edgePage=-1};root.addEventListener('pointerup',finish);root.addEventListener('pointercancel',finish);root.addEventListener('click',e=>{const item=e.target.closest('.home-feature');if(!item||suppressClick){e.preventDefault();return}const f=HOME_FEATURES.find(x=>x.id===item.dataset.id);if(!f)return;if(f.path.endsWith('.html'))location.assign(f.path);else appNavigate(f.path)})}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function switchTab(name, el, options={}) {
  document.querySelectorAll(".tab-item").forEach(b => b.classList.remove("active"));
  const activeTab=el||(name==='home'?document.querySelector('.tab-center'):[...document.querySelectorAll('.tab-item')].find(b=>b.getAttribute('onclick')?.includes(`'${name}'`)));
  activeTab?.classList.add("active");
  const homePanel = document.getElementById("homePanel");
  const messages = document.getElementById("messages");
  const inputArea = document.getElementById("inputArea");
  const tabBar=document.getElementById('tabBar');
  const chatting=name==='chat';
  document.documentElement.classList.remove('home-bg','chat-bg');
  document.body.classList.remove('home-bg','chat-bg');
  if(name==='home'){document.documentElement.classList.add('home-bg');document.body.classList.add('home-bg')}
  if(name==='chat'){document.documentElement.classList.add('chat-bg');document.body.classList.add('chat-bg')}
  document.getElementById('app').classList.toggle('chat-view',chatting);
  if(name==='home'&&options.replaceHistory)history.replaceState({view:'home'},'',location.href);
  if(name==='chat'&&!options.fromHistory&&history.state?.view!=='chat')history.pushState({view:'chat'},'',location.href);
  tabBar.style.display=chatting?'none':'flex';inputArea.classList.toggle('chat-mode',chatting);
  if (name === "home") {
    messages.style.display = "none";
    inputArea.style.display = "none";
    homePanel.style.display = "block";
  } else if (name === "chat") {
    homePanel.style.display = "none";
    messages.style.display = "";
    inputArea.style.display = "";
    if(!options.deferScroll)scheduleScrollBottom();
  } else if (name === "memory") {
    markHomeAsReturnView();
    location.href = pageURL("/context.html") + "&tab=memory";
  } else if (name === "diary") {
    markHomeAsReturnView();
    location.href = pageURL("/diary.html");
  }
}
window.addEventListener('popstate',event=>{
  if(event.state?.view==='chat')switchTab('chat',null,{fromHistory:true});else renderAppRoute();
});
window.addEventListener('pageshow',()=>{
  if(history.state?.view==='chat')switchTab('chat',null,{fromHistory:true});else renderAppRoute();
});
history.replaceState({view:'home'},'',location.href);
syncModelChannel();
init();
