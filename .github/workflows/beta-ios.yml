name: MyApp Beta unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main, beta, 'beta/**']
    paths:
      - 'ios-swift/MyAppBeta/**'
      - 'ios-swift/MyAppBetaTests/**'
      - 'ios-swift/MyAppBeta.xcodeproj/**'
      - 'ios-swift/tools/**'
      - 'ios-swift/tests/**'
      - '.github/workflows/beta-ios.yml'
permissions:
  contents: read
concurrency:
  group: beta-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      BETA_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and bridge
        working-directory: ios-swift
        run: |
          python3 tools/check_project.py
          node --test tests/bridge.test.cjs
      - name: Compile iOS unit tests
        working-directory: ios-swift
        run: bash tools/test_ios.sh
      - name: Build unsigned device IPA
        working-directory: ios-swift
        run: bash tools/build_ipa.sh
      - name: Upload SideStore package
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Beta-unsigned-${{ github.run_number }}
          path: |
            ios-swift/build/MyApp-Beta-unsigned.ipa
            ios-swift/build/MyApp-Beta-unsigned.json
            ios-swift/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Beta-checks-${{ github.run_number }}
          path: |
            ios-swift/build/*.log
            ios-swift/build/*xcresult
            ios-swift/build/xcode-version.txt
          if-no-files-found: ignore
          retention-days: 7
